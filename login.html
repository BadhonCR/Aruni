<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#123c35"><title>Member Login | Aruni Chatrabas</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head>
<body class="login-page"><main class="login-wrap">
<a class="back-link" href="index.html">← <span data-bn="হোমপেজে ফিরে যান" data-en="Back to homepage">হোমপেজে ফিরে যান</span></a>
<section class="login-card">
<a class="navbar-brand d-inline-flex align-items-center gap-2 mb-4" href="index.html"><span class="brand-mark">A</span><span><strong>ARUNI</strong><small>CHATRABAS</small></span></a>
<span class="section-kicker" data-bn="সদস্য প্রবেশ" data-en="MEMBER ACCESS">সদস্য প্রবেশ</span>
<h1 data-bn="স্বাগতম!" data-en="Welcome back!">স্বাগতম!</h1>
<p data-bn="আপনার নিবন্ধিত ইমেইল ও পাসওয়ার্ড দিয়ে প্রবেশ করুন।" data-en="Sign in with your registered email and password.">আপনার নিবন্ধিত ইমেইল ও পাসওয়ার্ড দিয়ে প্রবেশ করুন।</p>
<form id="loginForm" class="mt-4">
<div class="mb-3"><label class="form-label" for="email">ইমেইল / Email</label><input class="form-control" id="email" type="email" autocomplete="username" required placeholder="name@example.com"></div>
<div class="mb-3"><label class="form-label" for="password">পাসওয়ার্ড / Password</label><input class="form-control" id="password" type="password" autocomplete="current-password" required placeholder="আপনার পাসওয়ার্ড"></div>
<button class="btn btn-primary-custom w-100 mt-2" type="submit">লগইন / Sign in</button>
<div id="loginStatus" class="small" role="status" aria-live="polite"></div>
</form>
<p class="small mt-3 mb-0">নতুন অ্যাকাউন্ট প্রয়োজন হলে ছাত্রাবাসের প্রশাসকের সঙ্গে যোগাযোগ করুন। Public signup is disabled.</p>
</section><p class="login-foot">© <span id="year"></span> Aruni Chatrabas</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/app.js"></script>
</body></html>
